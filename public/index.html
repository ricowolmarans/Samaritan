<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Samaritan</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --bg-glow: #ffe9ea;
  --ink: #b3121f;
  --ink-dim: #d4838a;
  --idle: #e8838a;
  --listen: #e5202f;
  --think: #e5202f;
  --speak: #b3121f;
  --mute: #e5202f;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); }
body { display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }

.stage {
  --accent: var(--idle);
  container-type: inline-size;
  position: relative;
  width: min(100vw, calc(100vh * 1024 / 600));
  aspect-ratio: 1024 / 600;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 45%, var(--bg-glow), var(--bg) 70%);
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.stage[data-state="listening"] { --accent: var(--listen); }
.stage[data-state="thinking"]  { --accent: var(--think); }
.stage[data-state="speaking"]  { --accent: var(--speak); }
.stage[data-state="muted"]     { --accent: #ffffff; --ink: #ffffff; --ink-dim: #ffd2d5; background: var(--mute); }

canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: pointer; }

.name { position: absolute; top: 3.2cqw; left: 3.6cqw; font-size: 2.4cqw; font-weight: 600; letter-spacing: .01em; color: var(--ink-dim); }
.status { position: absolute; top: 8.5cqw; width: 100%; text-align: center; font-size: 3.4cqw; font-weight: 500; color: var(--accent); transition: color .3s ease; pointer-events: none; }
.caption { position: absolute; bottom: 8.5cqw; left: 50%; transform: translateX(-50%); width: 64cqw; text-align: center; white-space: pre-line; font-size: 2.1cqw; line-height: 1.3; color: var(--ink-dim); pointer-events: none; }
.hint { position: absolute; bottom: 3.6cqw; width: 100%; text-align: center; font-size: 1.8cqw; color: var(--ink-dim); pointer-events: none; }

.ctrl { position: absolute; bottom: 3.6cqw; display: flex; flex-direction: column; align-items: center; gap: 1cqw; font-size: 1.9cqw; color: var(--ink-dim); }
.ctrl.left { left: 5cqw; }
.ctrl.right { right: 5cqw; }
.btn {
  width: max(9cqw, 64px); height: max(9cqw, 64px); border-radius: 50%;
  display: grid; place-items: center; cursor: pointer; color: var(--ink);
  background: transparent; border: 2px solid var(--ink-dim);
  transition: background .2s ease, border-color .2s ease, transform .12s ease;
}
.btn:active { transform: scale(.94); }
.btn:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
.btn svg { width: 42%; height: 42%; }
#start { border-color: var(--listen); }
#start[aria-pressed="true"] { background: rgba(229,32,47,.14); }
#start:disabled { opacity: .35; cursor: not-allowed; border-color: var(--ink-dim); }
#mute[aria-pressed="true"] { background: #ffffff; border-color: #ffffff; color: var(--mute); }
#mute .off, #mute[aria-pressed="true"] .on { display: none; }
#mute[aria-pressed="true"] .off { display: block; }

@media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>
</head>
<body>
<main class="stage" id="stage" data-state="idle">
  <canvas id="wave" aria-label="Soundwave. Tap to stop Samaritan speaking."></canvas>
  <div class="name">Samaritan</div>
  <div class="status" id="status" aria-live="polite">Tap the mic to talk</div>
  <div class="caption" id="caption"></div>

  <div class="ctrl left">
    <button class="btn" id="start" aria-pressed="false" aria-label="Start listening">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <span id="startCap">Listen</span>
  </div>

  <div class="hint">Tap the wave to stop a reply</div>

  <div class="ctrl right">
    <button class="btn" id="mute" aria-pressed="false" aria-label="Mute microphone">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></svg>
    </button>
    <span id="muteCap">Mute mic</span>
  </div>
  <audio id="player"></audio>
</main>

<script>
(function () {
  var VOICE_LEVEL = 0.03;      // how loud counts as speech (raise if it never stops listening)
  var SILENCE_MS = 1300;       // quiet time that ends your turn
  var NO_SPEECH_MS = 7000;     // give up if nothing is said
  var MAX_MS = 20000;          // hard limit per turn

  var $ = function (id) { return document.getElementById(id); };
  var stage = $('stage'), canvas = $('wave'), ctx = canvas.getContext('2d');
  var statusEl = $('status'), captionEl = $('caption'), audioEl = $('player');
  var startBtn = $('start'), muteBtn = $('mute'), startCap = $('startCap'), muteCap = $('muteCap');

  var labels = {
    idle: 'Tap the mic to talk',
    listening: 'Listening…',
    thinking: 'Thinking…',
    speaking: 'Speaking…',
    muted: 'Mic off'
  };
  var state = 'idle', muted = false, accent = '#e8838a';
  var actx, analyser, micStream, micSrc, playSrc, rec, chunks = [];
  var cancelled = false, heard = false, lastVoice = 0, t0 = 0;
  var abortCtl = null, playId = 0, fakeSpeech = false;
  var starting = false;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function setState(s) {
    state = s;
    stage.dataset.state = s;
    statusEl.textContent = labels[s];
    accent = getComputedStyle(stage).getPropertyValue('--accent').trim() || accent;
    var busy = s === 'listening' || s === 'thinking' || s === 'speaking';
    startBtn.setAttribute('aria-pressed', String(busy));
    startBtn.setAttribute('aria-label', busy ? 'Stop' : 'Start listening');
    startCap.textContent = busy ? 'Stop' : 'Listen';
    startBtn.disabled = muted;
  }
  function caption(t) { captionEl.textContent = t || ''; }

  /* ---------- audio plumbing ---------- */
  function ensureAudio() {
    if (actx) return;
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 128;
    analyser.smoothingTimeConstant = 0.6;
    playSrc = actx.createMediaElementSource(audioEl);
    playSrc.connect(analyser);
    playSrc.connect(actx.destination);
  }
  async function ensureMic() {
    if (micStream && micStream.active) return;
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
    });
    micSrc = actx.createMediaStreamSource(micStream);
  }
  function releaseMic() {
    if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); });
    micStream = null; micSrc = null;
  }

  /* ---------- listening ---------- */
  async function startListening() {
    if (muted || state !== 'idle' || starting) return;
    starting = true;
    caption('');
    try {
      ensureAudio();
      await actx.resume();
      if (!navigator.mediaDevices) throw new Error('the mic needs https or localhost');
      await ensureMic();
    } catch (e) {
      starting = false;
      caption('Mic unavailable: ' + e.message);
      return;
    }
    micSrc.connect(analyser);
    chunks = []; cancelled = false; heard = false; t0 = performance.now(); lastVoice = t0;
    var mime = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4'].find(function (m) {
      return window.MediaRecorder && MediaRecorder.isTypeSupported(m);
    });
    rec = new MediaRecorder(micStream, mime ? { mimeType: mime } : undefined);
    rec.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    rec.onstop = onRecStop;
    rec.start();
    starting = false;
    setState('listening');
  }
  function finishRec() { if (rec && rec.state === 'recording') rec.stop(); }

  function tickVAD(level, now) {
    if (level > VOICE_LEVEL) { heard = true; lastVoice = now; }
    var waited = now - t0;
    if (heard && now - lastVoice > SILENCE_MS) finishRec();
    else if (!heard && waited > NO_SPEECH_MS) { cancelled = true; finishRec(); }
    else if (waited > MAX_MS) finishRec();
  }

  async function onRecStop() {
    try { if (micSrc) micSrc.disconnect(analyser); } catch (e) {}
    var blob = new Blob(chunks, { type: (rec && rec.mimeType) || 'audio/webm' });
    if (cancelled || !heard || blob.size < 1500) {
      setState(muted ? 'muted' : 'idle');
      if (!cancelled && !muted) caption('Didn’t catch that. Tap the mic and try again.');
      return;
    }
    await ask(blob);
  }

  /* ---------- talking to the server ---------- */
  async function ask(blob) {
    setState('thinking');
    abortCtl = new AbortController();
    var data;
    try {
      var r = await fetch('/api/talk', {
        method: 'POST',
        headers: { 'Content-Type': blob.type },
        body: blob,
        signal: abortCtl.signal
      });
      data = await r.json();
      if (!r.ok) throw new Error(data.error || r.statusText);
    } catch (e) {
      if (e.name === 'AbortError') return;
      caption('Something went wrong: ' + e.message);
      setState('idle');
      return;
    }
    abortCtl = null;
    if (!data.heard) { caption('Didn’t catch that.'); setState('idle'); return; }
    caption('You: ' + data.heard + '\nSamaritan: ' + data.reply);
    if (data.audio && data.audio.length) await playAudio(data.audio);
    else await speakFallback(data.reply);
  }

  function b64ToBlob(b64, type) {
    var bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new Blob([bytes], { type: type });
  }

  async function playAudio(list) {
    var id = ++playId;
    fakeSpeech = false;
    setState('speaking');
    for (var i = 0; i < list.length; i++) {
      if (id !== playId) return;
      var url = URL.createObjectURL(b64ToBlob(list[i], 'audio/wav'));
      audioEl.src = url;
      await new Promise(function (res) {
        audioEl.onended = audioEl.onerror = audioEl.onpause = res;
        audioEl.play().catch(res);
      });
      URL.revokeObjectURL(url);
    }
    if (id === playId) setState('idle');
  }

  function speakFallback(text) {
    var id = ++playId;
    fakeSpeech = true;
    setState('speaking');
    return new Promise(function (res) {
      if (!('speechSynthesis' in window)) return res();
      var u = new SpeechSynthesisUtterance(text);
      u.onend = u.onerror = res;
      speechSynthesis.speak(u);
    }).then(function () {
      fakeSpeech = false;
      if (id === playId) setState('idle');
    });
  }

  function stopAll() {
    playId++;
    audioEl.pause();
    fakeSpeech = false;
    if (abortCtl) { abortCtl.abort(); abortCtl = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  }

  /* ---------- controls ---------- */
  startBtn.addEventListener('click', function () {
    if (muted) return;
    if (state === 'idle') startListening();
    else if (state === 'listening') { cancelled = true; finishRec(); }
    else { stopAll(); setState('idle'); }
  });
  canvas.addEventListener('click', function () {
    if (state === 'speaking') { stopAll(); setState('idle'); }
  });
  muteBtn.addEventListener('click', function () {
    muted = !muted;
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? 'Unmute microphone' : 'Mute microphone');
    muteCap.textContent = muted ? 'Unmute' : 'Mute mic';
    if (muted) { cancelled = true; finishRec(); stopAll(); releaseMic(); caption(''); }
    setState(muted ? 'muted' : 'idle');
  });

  /* ---------- soundwave bars ---------- */
  function resize() {
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(canvas.clientWidth * dpr);
    canvas.height = Math.round(canvas.clientHeight * dpr);
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  var N = 33, bars = [];
  for (var k = 0; k < N; k++) bars.push(0);
  var td = new Uint8Array(128), fd = new Uint8Array(64);

  function draw(t) {
    var W = canvas.width, H = canvas.height, dpr = window.devicePixelRatio || 1;
    var mid = (N - 1) / 2, span = W * 0.72, x0 = (W - span) / 2, step = span / (N - 1);
    var calm = reduce ? 0.5 : 1;
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'round';
    ctx.lineWidth = Math.max(step * 0.5, 4 * dpr);
    ctx.strokeStyle = accent;
    ctx.shadowColor = accent;
    ctx.shadowBlur = 14 * dpr;
    for (var i = 0; i < N; i++) {
      var nx = i / (N - 1), env = Math.pow(Math.sin(Math.PI * nx), 1.2);
      var dist = Math.abs(i - mid) / mid, target = 0;
      if (state === 'idle') target = (0.04 + 0.03 * Math.sin(t * 1.4 + i * 0.5)) * calm;
      else if (state === 'thinking') target = (0.05 + 0.22 * Math.max(0, Math.sin(nx * 9 - t * 6))) * calm;
      else if (state === 'speaking' && fakeSpeech) target = (0.1 + 0.5 * Math.abs(Math.sin(t * 5 + i * 0.7) * Math.sin(t * 2.3 + i * 0.3))) * env * calm;
      else if ((state === 'listening' || state === 'speaking') && analyser) {
        var bin = Math.min(fd.length - 1, 1 + Math.floor(dist * 30));
        target = 0.04 + Math.pow(fd[bin] / 255, 1.3) * (0.35 + 0.65 * env);
      }
      bars[i] += (target - bars[i]) * 0.35;
      var h = Math.max(0, bars[i]) * H * 0.5, x = x0 + i * step;
      ctx.beginPath();
      ctx.moveTo(x, H / 2 - h / 2);
      ctx.lineTo(x, H / 2 + h / 2);
      ctx.stroke();
    }
  }

  function frame(ms) {
    var level = 0;
    if (analyser && (state === 'listening' || state === 'speaking')) {
      analyser.getByteTimeDomainData(td);
      var s = 0;
      for (var i = 0; i < td.length; i++) { var d = (td[i] - 128) / 128; s += d * d; }
      level = Math.sqrt(s / td.length);
      analyser.getByteFrequencyData(fd);
    }
    if (state === 'listening') tickVAD(level, ms);
    draw(ms / 1000);
    requestAnimationFrame(frame);
  }

  setState('idle');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
